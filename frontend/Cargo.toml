[package]
name = "alg-trainers-frontend"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
gloo-net = "0.6"
gloo-storage = "0.3"
gloo-timers = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "CssStyleDeclaration", "KeyboardEvent", "PointerEvent", "DragEvent", "EventTarget", "Storage", "File", "FileList", "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbObjectStore", "IdbTransaction", "IdbRequest", "Event", "MessageEvent", "console"] }
